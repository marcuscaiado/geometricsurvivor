<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Segurança: Content Security Policy restringe fontes de script apenas para este domínio e o CDN confiável -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <title>Geometric Survivor 3D</title>
    
    <!-- Importando Three.js com atributo crossorigin para segurança -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <style>
        :root {
            --accent: #e94560;
            --ui-bg: rgba(22, 33, 62, 0.9);
            --font-main: 'Courier New', Courier, monospace;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #050510; 
            color: white; 
            font-family: var(--font-main); 
            user-select: none; /* Previne seleção de texto acidental */
            -webkit-user-select: none;
        }
        
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; outline: none; }

        /* UI Layer */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; justify-content: center; align-items: center;
            z-index: 10;
        }

        /* HUD */
        #hud {
            position: absolute; top: 20px; left: 20px;
            pointer-events: none; text-align: left;
            text-shadow: 0 0 5px #000;
            z-index: 5;
        }

        .bar-container {
            width: 200px; height: 15px; background: rgba(0,0,0,0.5);
            margin-bottom: 5px; border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px; overflow: hidden;
        }
        .bar-fill { height: 100%; transition: width 0.2s ease-out; box-shadow: 0 0 10px currentColor; }
        #hp-bar { background-color: #e94560; color: #e94560; width: 100%; }
        #xp-bar { background-color: #fce38a; color: #fce38a; width: 0%; }

        /* Menus */
        .modal {
            background: var(--ui-bg); padding: 40px;
            border: 2px solid var(--accent);
            text-align: center; pointer-events: auto;
            display: none; flex-direction: column; gap: 20px;
            box-shadow: 0 0 50px rgba(233, 69, 96, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            min-width: 300px;
        }
        .modal.active { display: flex; animation: fadeIn 0.3s ease-out; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        h1 { margin: 0; color: var(--accent); text-transform: uppercase; letter-spacing: 3px; font-size: 2rem; }
        p { color: #ccc; line-height: 1.5; }

        button {
            background: transparent; border: 1px solid var(--accent); color: white;
            padding: 15px 40px; font-family: inherit; font-size: 1.2rem; cursor: pointer;
            transition: all 0.2s; text-transform: uppercase; font-weight: bold;
        }
        button:hover { background: var(--accent); box-shadow: 0 0 20px var(--accent); color: #fff; }
        button:active { transform: scale(0.98); }

        .upgrade-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; width: 100%; max-width: 600px; }
        .upgrade-card {
            border: 1px solid rgba(255,255,255,0.2); padding: 15px; cursor: pointer;
            background: rgba(0,0,0,0.3); transition: 0.3s;
            display: flex; flex-direction: column; justify-content: center;
        }
        .upgrade-card:hover { background: var(--accent); transform: translateY(-5px); border-color: #fff; }
        .upgrade-card h3 { color: #fce38a; margin: 0 0 8px 0; font-size: 1rem; }
        .upgrade-card p { font-size: 0.8rem; margin: 0; color: #ddd; }
    </style>
</head>
<body>

<div id="game-container"></div>

<div id="hud">
    <div style="font-weight: bold;">HP <span id="hp-text">100/100</span></div>
    <div class="bar-container"><div id="hp-bar" class="bar-fill"></div></div>
    <div style="font-weight: bold; margin-top: 10px;">LVL <span id="lvl-text">1</span></div>
    <div class="bar-container"><div id="xp-bar" class="bar-fill"></div></div>
    <div id="score-text" style="margin-top: 10px;">SCORE: 0</div>
</div>

<div class="ui-layer">
    <div id="start-screen" class="modal active">
        <h1>NEON SURVIVOR 3D</h1>
        <p>Protocolo de Segurança Ativado.<br>Elimine as anomalias geométricas.</p>
        <p style="font-size: 0.9em; color: #888;">[WASD] Mover | [MOUSE] Mirar/Atirar</p>
        <button id="btn-start">INICIAR SISTEMA</button>
    </div>

    <div id="upgrade-screen" class="modal">
        <h1>UPGRADE DISPONÍVEL</h1>
        <div class="upgrade-grid" id="upgrade-options"></div>
    </div>

    <div id="game-over-screen" class="modal">
        <h1>SINAL PERDIDO</h1>
        <p>Eficiência do combate: <span id="final-score">0</span> pts</p>
        <button id="btn-restart">REINICIAR</button>
    </div>
</div>

<script>
/**
 * GEOMETRIC SURVIVOR 3D - Optimized Core
 * Encapsulado em IIFE para prevenir acesso global (Anti-Console Cheating básico)
 */
(function() {
    "use strict"; // Força boas práticas de JS

    // --- CONSTANTES IMUTÁVEIS (Segurança de Runtime) ---
    const CONFIG = Object.freeze({
        WORLD_SIZE: 400,
        COLORS: {
            BG: 0x050510,
            GRID1: 0x535c68,
            GRID2: 0x130f40,
            PLAYER: 0x00d2d3,
            ENEMY_BASE: 0xff4757,
            PROJECTILE: 0xffff00
        },
        SPAWN: {
            INITIAL_RATE: 2.0,
            MIN_RATE: 0.4
        }
    });

    // --- VETORES TEMPORÁRIOS (Otimização de Memória) ---
    // Evita criar 'new THREE.Vector3' dentro do loop de renderização (Garbage Collection Reduction)
    const _tempVec3 = new THREE.Vector3();
    const _tempDir = new THREE.Vector3();
    const _tempPos = new THREE.Vector3();

    // --- VARIÁVEIS DO ESCOPO ---
    let scene, camera, renderer, raycaster;
    let planeMesh; 
    let mouse3D = new THREE.Vector3();
    
    // Estado do Jogo
    const GameState = { MENU: 0, PLAYING: 1, LEVEL_UP: 2, GAME_OVER: 3 };
    let currentState = GameState.MENU;
    let entities = [];
    let particles = [];
    let score = 0;
    let waveTimer = 0;
    let lastTime = 0;
    let animationFrameId;

    // Inputs
    const keys = { w: false, a: false, s: false, d: false };
    const mouse = { x: 0, y: 0, down: false };

    // Elementos de UI (Cache)
    const ui = {
        screens: {
            menu: document.getElementById('start-screen'),
            gameover: document.getElementById('game-over-screen'),
            upgrade: document.getElementById('upgrade-screen')
        },
        hud: {
            hpBar: document.getElementById('hp-bar'),
            xpBar: document.getElementById('xp-bar'),
            hpText: document.getElementById('hp-text'),
            lvlText: document.getElementById('lvl-text'),
            scoreText: document.getElementById('score-text'),
            finalScore: document.getElementById('final-score'),
            upgradesDiv: document.getElementById('upgrade-options')
        }
    };

    // --- INICIALIZAÇÃO ---
    function init() {
        setupThreeJS();
        setupInputs();
        setupEvents();
        animate(0);
    }

    function setupThreeJS() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(CONFIG.COLORS.BG);
        scene.fog = new THREE.FogExp2(CONFIG.COLORS.BG, 0.0035);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 180, 100);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limita pixel ratio para performance
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Sombras mais suaves
        document.getElementById('game-container').appendChild(renderer.domElement);

        // Iluminação
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(100, 200, 100);
        dirLight.castShadow = true;
        // Otimização de sombras: área restrita ao gameplay
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        const d = 250;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // Grid e Ambiente
        const gridHelper = new THREE.GridHelper(CONFIG.WORLD_SIZE * 2, 40, CONFIG.COLORS.GRID1, CONFIG.COLORS.GRID2);
        scene.add(gridHelper);

        // Plane invisível para Raycasting
        const planeGeo = new THREE.PlaneGeometry(1000, 1000);
        const planeMat = new THREE.MeshBasicMaterial({ visible: false });
        planeMesh = new THREE.Mesh(planeGeo, planeMat);
        planeMesh.rotation.x = -Math.PI / 2;
        scene.add(planeMesh);

        raycaster = new THREE.Raycaster();
    }

    function setupEvents() {
        document.getElementById('btn-start').onclick = startGame;
        document.getElementById('btn-restart').onclick = startGame;
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Previne menu de contexto (botão direito) durante o jogo
        document.addEventListener('contextmenu', event => event.preventDefault());
    }

    function setupInputs() {
        const onKey = (e, status) => {
            const k = e.key.toLowerCase();
            if (keys.hasOwnProperty(k)) {
                keys[k] = status;
            }
        };

        window.addEventListener('keydown', e => onKey(e, true));
        window.addEventListener('keyup', e => onKey(e, false));
        
        window.addEventListener('mousedown', () => mouse.down = true);
        window.addEventListener('mouseup', () => mouse.down = false);
        
        window.addEventListener('mousemove', (event) => {
            // Normalização de coordenadas (-1 a +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });
    }

    function startGame() {
        // Cleanup completo
        entities.forEach(e => {
            scene.remove(e.mesh);
            if(e.mesh.geometry) e.mesh.geometry.dispose();
            if(e.mesh.material) e.mesh.material.dispose();
        });
        particles.forEach(p => scene.remove(p.mesh));
        
        entities = [];
        particles = [];
        score = 0;
        waveTimer = 0;
        
        // Player Init
        const player = new Player();
        entities.push(player);
        
        currentState = GameState.PLAYING;
        toggleModal('none');
    }

    function toggleModal(id) {
        Object.values(ui.screens).forEach(el => el.classList.remove('active'));
        if(id !== 'none' && ui.screens[id]) return ui.screens[id].classList.add('active'); // Bug fix: return element
        if(id !== 'none') document.getElementById(id).classList.add('active'); // Fallback
    }

    // --- GAME LOOP ---
    function animate(time) {
        animationFrameId = requestAnimationFrame(animate);
        
        // Delta Time Cap (previne bugs de física se o frame rate cair muito)
        const dt = Math.min((time - lastTime) / 1000, 0.1); 
        lastTime = time;

        if (currentState === GameState.PLAYING) {
            updateLogic(dt);
            updateHUD();
        }

        renderer.render(scene, camera);
    }

    function updateLogic(dt) {
        // Raycaster Otimizado
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(planeMesh);
        if (intersects.length > 0) {
            mouse3D.copy(intersects[0].point);
        }

        // Spawn System
        waveTimer += dt;
        const difficultyFactor = Math.min(score / 5000, 1); // 0 a 1
        const currentSpawnRate = CONFIG.SPAWN.INITIAL_RATE - (difficultyFactor * (CONFIG.SPAWN.INITIAL_RATE - CONFIG.SPAWN.MIN_RATE));
        
        if (waveTimer > currentSpawnRate) {
            spawnEnemy();
            waveTimer = 0;
        }

        // Entity Update Loop (Reverso para splice seguro)
        for (let i = entities.length - 1; i >= 0; i--) {
            const ent = entities[i];
            ent.update(dt);
            
            if (ent.dead) {
                scene.remove(ent.mesh);
                // Dispose materials/geometry para evitar memory leak
                if(ent.mesh.geometry) ent.mesh.geometry.dispose();
                // Material pode ser compartilhado, cuidado ao dar dispose
                entities.splice(i, 1);
            }
        }

        // Particle Update Loop
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.update(dt);
            if (p.dead) {
                scene.remove(p.mesh);
                if(p.mesh.geometry) p.mesh.geometry.dispose();
                particles.splice(i, 1);
            }
        }

        // Camera Follow Suavizado
        const player = entities.find(e => e instanceof Player);
        if (player) {
            const targetX = player.mesh.position.x;
            const targetZ = player.mesh.position.z + 80;
            
            camera.position.x += (targetX - camera.position.x) * 0.1;
            camera.position.z += (targetZ + 100 - camera.position.z) * 0.1;
            camera.lookAt(targetX, 0, targetZ - 50);
        }
    }

    function updateHUD() {
        const player = entities.find(e => e instanceof Player);
        if (!player) return;

        ui.hud.hpText.textContent = `${Math.ceil(player.hp)}/${player.maxHp}`;
        ui.hud.hpBar.style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
        
        ui.hud.lvlText.textContent = player.level;
        ui.hud.xpBar.style.width = `${(player.xp / player.xpToNext) * 100}%`;
        
        ui.hud.scoreText.textContent = `SCORE: ${Math.floor(score)}`;
    }

    function spawnEnemy() {
        let x, z;
        const dist = CONFIG.WORLD_SIZE;
        // Spawn sempre nas bordas para não aparecer na cara do player
        if (Math.random() < 0.5) {
            x = (Math.random() - 0.5) * dist * 2;
            z = Math.random() < 0.5 ? -dist : dist;
        } else {
            x = Math.random() < 0.5 ? -dist : dist;
            z = (Math.random() - 0.5) * dist * 2;
        }
        
        const difficultyLvl = 1 + Math.floor(score / 500);
        entities.push(new Enemy(x, z, Math.min(difficultyLvl, 20)));
    }

    function createExplosion(x, z, color, count) {
        for(let i=0; i<count; i++) {
            particles.push(new Particle(x, z, color));
        }
    }

    // --- CLASSES ---

    class Entity {
        constructor(mesh) {
            this.mesh = mesh;
            scene.add(this.mesh);
            this.dead = false;
            this.radius = 5;
        }
        update(dt) {}
    }

    class Player extends Entity {
        constructor() {
            const group = new THREE.Group();
            
            // Materiais reutilizáveis não são ideais aqui pois modificamos cor, 
            // mas geometries devem ser reutilizadas em projetos maiores.
            const bodyGeo = new THREE.BoxGeometry(10, 10, 10);
            const bodyMat = new THREE.MeshLambertMaterial({ color: CONFIG.COLORS.PLAYER });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 5;
            body.castShadow = true;
            
            const turretGeo = new THREE.BoxGeometry(4, 4, 8);
            const turretMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const turret = new THREE.Mesh(turretGeo, turretMat);
            turret.position.set(0, 8, 4);

            group.add(body);
            group.add(turret);

            super(group);
            
            this.mesh.position.set(0, 0, 0);
            this.speed = 85;
            this.maxHp = 100;
            this.hp = this.maxHp;
            this.fireRate = 0.25;
            this.shootTimer = 0;
            this.damage = 15;
            this.projSpeed = 160;
            this.level = 1;
            this.xp = 0;
            this.xpToNext = 100;
        }

        update(dt) {
            // Input Vector Optimization
            _tempVec3.set(0, 0, 0);
            if (keys.w) _tempVec3.z = -1;
            if (keys.s) _tempVec3.z = 1;
            if (keys.a) _tempVec3.x = -1;
            if (keys.d) _tempVec3.x = 1;

            if (_tempVec3.lengthSq() > 0) {
                _tempVec3.normalize().multiplyScalar(this.speed * dt);
                this.mesh.position.add(_tempVec3);
            }

            // Clamping
            const limit = CONFIG.WORLD_SIZE - 5;
            this.mesh.position.x = Math.max(-limit, Math.min(limit, this.mesh.position.x));
            this.mesh.position.z = Math.max(-limit, Math.min(limit, this.mesh.position.z));

            this.mesh.lookAt(mouse3D.x, 0, mouse3D.z);

            // Shooting
            if (this.shootTimer > 0) this.shootTimer -= dt;
            if (mouse.down && this.shootTimer <= 0) {
                this.shoot();
                this.shootTimer = this.fireRate;
            }

            if (this.hp <= 0) this.die();
        }

        shoot() {
            _tempPos.copy(this.mesh.position);
            _tempPos.y = 8;
            
            // Calcula direção usando vetores temporários
            _tempDir.subVectors(mouse3D, this.mesh.position).normalize();
            _tempDir.y = 0; // Trava no eixo Y
            
            entities.push(new Projectile(_tempPos, _tempDir, this.projSpeed, this.damage));
        }

        gainXp(amount) {
            this.xp += amount;
            if (this.xp >= this.xpToNext) {
                this.xp -= this.xpToNext;
                this.level++;
                this.xpToNext = Math.floor(this.xpToNext * 1.5);
                this.triggerLevelUp();
            }
        }

        triggerLevelUp() {
            currentState = GameState.LEVEL_UP;
            toggleModal('upgrade-screen');
            
            // Sistema de Upgrades Seguro
            const upgrades = [
                { name: "Motor V8", desc: "+20% Movimento", action: () => this.speed *= 1.2 },
                { name: "Núcleo Instável", desc: "+25% Dano", action: () => this.damage *= 1.25 },
                { name: "Gatilho Leve", desc: "-15% Recarga", action: () => this.fireRate = Math.max(0.05, this.fireRate * 0.85) },
                { name: "Acelerador Magnético", desc: "+20% Vel. Projétil", action: () => this.projSpeed *= 1.2 },
                { name: "Reparo de Casco", desc: "Cura Total + 25HP Max", action: () => { this.maxHp += 25; this.hp = this.maxHp; } }
            ];

            // Shuffle seguro
            const options = upgrades.sort(() => 0.5 - Math.random()).slice(0, 3);

            ui.hud.upgradesDiv.innerHTML = '';
            options.forEach(upg => {
                const div = document.createElement('div');
                div.className = 'upgrade-card';
                // textContent para segurança XSS
                const h3 = document.createElement('h3'); h3.textContent = upg.name;
                const p = document.createElement('p'); p.textContent = upg.desc;
                div.appendChild(h3);
                div.appendChild(p);
                
                div.onclick = () => {
                    upg.action();
                    currentState = GameState.PLAYING;
                    toggleModal('none');
                };
                ui.hud.upgradesDiv.appendChild(div);
            });
        }

        die() {
            currentState = GameState.GAME_OVER;
            ui.hud.finalScore.textContent = Math.floor(score);
            toggleModal('game-over-screen');
        }
    }

    class Enemy extends Entity {
        constructor(x, z, level) {
            const geo = new THREE.TetrahedronGeometry(6 + (level * 0.2), 0);
            const hue = (level * 0.05) % 1; 
            const color = new THREE.Color().setHSL(hue, 0.7, 0.5);
            const mat = new THREE.MeshLambertMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            
            mesh.position.set(x, 6, z);
            mesh.castShadow = true;

            super(mesh);
            
            // Stats escaláveis
            this.hp = 20 + (level * 10);
            this.speed = 30 + (level * 1.5);
            this.damage = 10 + level;
            this.xpVal = 20 * level;
            this.radius = 6 + (level * 0.2);
            this.rotSpeed = Math.random() * 2 + 1;
        }

        update(dt) {
            const player = entities.find(e => e instanceof Player);
            if (!player || player.dead) return;

            // Busca Simples
            _tempDir.subVectors(player.mesh.position, this.mesh.position);
            const dist = _tempDir.length();
            
            if(dist > 0) {
                _tempDir.normalize();
                this.mesh.position.add(_tempDir.multiplyScalar(this.speed * dt));
            }
            
            this.mesh.rotation.x += this.rotSpeed * dt;
            this.mesh.rotation.y += this.rotSpeed * dt;

            // Colisão Player (Overlap simples)
            if (dist < (this.radius + player.radius)) {
                player.hp -= this.damage * dt; 
            }
        }

        takeDamage(amount) {
            this.hp -= amount;
            // Visual Feedback sem criar novos materiais
            const oldColor = this.mesh.material.color.getHex();
            this.mesh.material.emissive.setHex(0xffffff);
            
            // Debounce visual simples
            if(!this.isFlashing) {
                this.isFlashing = true;
                setTimeout(() => { 
                    if(!this.dead && this.mesh) {
                        this.mesh.material.emissive.setHex(0x000000); 
                        this.isFlashing = false;
                    }
                }, 50);
            }

            if (this.hp <= 0 && !this.dead) {
                this.dead = true;
                score += this.xpVal;
                // Encontrar player de forma segura
                const player = entities.find(e => e instanceof Player);
                if(player) player.gainXp(this.xpVal);
                createExplosion(this.mesh.position.x, this.mesh.position.z, this.mesh.material.color, 8);
            }
        }
    }

    class Projectile extends Entity {
        constructor(pos, dir, speed, damage) {
            const geo = new THREE.SphereGeometry(2, 6, 6); // Geometria low-poly para tiros
            const mat = new THREE.MeshBasicMaterial({ color: CONFIG.COLORS.PROJECTILE });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            
            super(mesh);
            
            this.dir = dir.clone(); // Direção precisa ser clonada pois é única
            this.speed = speed;
            this.damage = damage;
            this.radius = 2;
            this.life = 2.0;
        }

        update(dt) {
            this.life -= dt;
            if (this.life <= 0) {
                this.dead = true;
                return;
            }

            _tempVec3.copy(this.dir).multiplyScalar(this.speed * dt);
            this.mesh.position.add(_tempVec3);

            // Verificação de colisão simples O(n)
            // Em jogos maiores, usaria Quadtree, mas aqui loop simples resolve
            for (const ent of entities) {
                if (ent instanceof Enemy && !ent.dead) {
                    const distSq = this.mesh.position.distanceToSquared(ent.mesh.position);
                    const radiiSum = this.radius + ent.radius;
                    
                    if (distSq < radiiSum * radiiSum) {
                        ent.takeDamage(this.damage);
                        this.dead = true;
                        createExplosion(this.mesh.position.x, this.mesh.position.z, CONFIG.COLORS.PROJECTILE, 3);
                        return;
                    }
                }
            }
        }
    }

    class Particle extends Entity {
        constructor(x, z, color) {
            const geo = new THREE.BoxGeometry(2, 2, 2);
            const mat = new THREE.MeshBasicMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 6, z);
            mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);

            super(mesh);
            
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 40 + 10;
            this.vel = new THREE.Vector3(Math.cos(angle)*speed, Math.random()*40, Math.sin(angle)*speed);
            this.gravity = -100;
            this.life = 1.0;
        }

        update(dt) {
            this.life -= dt * 2.5;
            if (this.life <= 0) this.dead = true;

            this.vel.y += this.gravity * dt;
            
            _tempVec3.copy(this.vel).multiplyScalar(dt);
            this.mesh.position.add(_tempVec3);
            
            this.mesh.scale.setScalar(Math.max(0, this.life));
            
            if (this.mesh.position.y < 1) {
                this.mesh.position.y = 1;
                this.vel.y *= -0.5;
                this.vel.x *= 0.8;
                this.vel.z *= 0.8;
            }
        }
    }

    // Iniciar Jogo
    init();

})(); 
</script>
</body>
</html>
